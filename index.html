<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>நலம் யோகா - Nalam Yoga</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3d2c;
            --primary-light: #346349;
            --accent: #52b788;
            --bg: #f4f7f5;
            --surface: #ffffff;
            --text: #1f2d26;
            --text-light: #5f7367;
            --border: #e0e8e3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(135deg, #1e3d2c, #346349);
            color: white;
            padding: 25px 20px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .lang-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .category-title {
            font-size: 1.3rem;
            margin: 25px 0 15px;
            color: var(--primary);
            border-left: 4px solid var(--accent);
            padding-left: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header {
            margin-bottom: 12px;
        }

        .pose-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary);
        }

        .pose-sub {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        /* Responsive Video Container */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            border-radius: 12px;
            overflow: hidden;
            margin: 12px 0;
            background-color: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .steps-box {
            background: #f8faf9;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ebf2ed;
        }

        .steps-box h4 {
            font-size: 0.85rem;
            color: var(--primary-light);
            margin-bottom: 6px;
        }

        .steps-list {
            font-size: 0.85rem;
            color: var(--text);
            line-height: 1.5;
            padding-left: 18px;
        }

        .card-footer {
            display: flex;
            gap: 10px;
        }

        button.btn-primary {
            border: none;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
            padding: 12px 16px;
            font-size: 0.9rem;
            background: var(--primary);
            color: white;
            flex: 1;
            transition: background 0.2s;
        }

        button.btn-primary:hover {
            background: var(--primary-light);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            padding: 25px;
            text-align: center;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            background: transparent;
            border: none;
            font-size: 1.4rem;
            color: var(--text-light);
            cursor: pointer;
        }

        .timer-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--primary);
            margin: 15px 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div>
                <h1 id="appTitle">🧘 நலம் யோகா</h1>
                <p id="appSub">ஆரோக்கியமான வாழ்க்கை மற்றும் ஆழ்ந்த தூக்கத்திற்கான யோகா வழிகாட்டி</p>
            </div>
            <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">English</button>
        </div>
    </header>

    <div class="container">
        
        <!-- NIGHT ROUTINE -->
        <h2 class="category-title" id="secNight">🌙 இரவுக் காலம் & நல்ல தூக்கம் (Night Routine)</h2>
        <div class="grid">
            
            <!-- Shavasana -->
            <div class="card">
                <div>
                    <div class="card-header">
                        <div class="pose-title" id="p1Title">1. சவாசனம் (Shavasana)</div>
                        <div class="pose-sub">Corpse Pose</div>
                    </div>
                    
                    <div class="video-container">
                        <iframe src="https://www.youtube.com/embed/2a4b8Z5cIUk" title="Shavasana Yoga Video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>

                    <div class="steps-box">
                        <h4 class="steps-head">எப்படிச் செய்ய வேண்டும்?</h4>
                        <ol class="steps-list" id="p1Steps">
